<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Divyajivan - Offline</title>
<meta name="theme-color" content="#0C8A5F">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#F5F3EE;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:24px;padding:40px 32px;max-width:380px;width:100%;box-shadow:0 2px 20px rgba(0,0,0,0.06)}
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.logo-row img{width:40px;height:40px;border-radius:10px;object-fit:cover}
.logo-row span{font-size:18px;font-weight:700;color:#0C8A5F}
.card h1{font-size:32px;font-weight:800;color:#1a1a1a;line-height:1.15;margin-bottom:16px;letter-spacing:-0.5px}
.card p{font-size:15px;color:#888;line-height:1.5;margin-bottom:32px}
.btn{display:block;width:100%;padding:18px;border-radius:16px;font-size:17px;font-weight:700;cursor:pointer;text-align:center;border:none;transition:transform 0.15s,opacity 0.15s}
.btn:active{transform:scale(0.97);opacity:0.85}
.btn-primary{background:#1a1a1a;color:#fff;margin-bottom:12px}
.btn-secondary{background:#fff;color:#1a1a1a;border:1.5px solid #e0e0e0}
</style>
</head>
<body>
<div class="card">
<div class="logo-row">
<img src="logo.webp" alt="Divyajivan">
<span>Divyajivan</span>
</div>
<h1>We could not reach Divyajivan</h1>
<p>Before your records open we check your privacy choices, and we could not do that just now. Check your connection and try again.</p>
<button class="btn btn-primary" onclick="window.location.reload()">Try again</button>
<button class="btn btn-secondary" onclick="try{localStorage.clear()}catch(e){}window.location.reload()">Sign out</button>
</div>
</body>
</html>
